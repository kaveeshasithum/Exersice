<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Card Management System</h2>

        <!-- Input Fields -->

        <div class="card p-4 mb-4">

            <h4 class="mb-3">Add New Card</h4>

            <input type="text" id="txtTitle" class="form-control mb-3"
                placeholder="Enter Card Title">

            <textarea id="txtDescription" class="form-control mb-3"
                placeholder="Enter Card Description"></textarea>

            <button class="btn btn-primary" id="btnAdd" onclick="addCard()">
                Add Card
            </button>

        </div>


        <!-- Card Display -->

        <h4 class="mb-3">My Cards</h4>

        <div class="row" id="cardContainer">

        </div>

    </div>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
